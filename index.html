<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trong Phan — Software Engineer</title>
    <meta
      name="description"
      content="Trong Phan — software engineer in Lexington, KY. React, Angular and Vue.js interfaces; APIs in Node.js, Hono, NestJS and .NET. U.S. Permanent Resident."
    />
    <meta name="theme-color" content="#E8DFD2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=IBM+Plex+Mono&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Set the stored theme before first paint */
      (function () {
        var t = 'light'
        try {
          if (localStorage.getItem('pf-theme') === 'dark') t = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
